name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

# Cancel in-progress runs of this workflow when a new commit is pushed to the
# same branch / PR, to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # CASA-free unit tests on multiple Python versions
  # -------------------------------------------------------------------------
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install AJISAI with dev extras
        run: |
          python -m pip install --upgrade pip
          # We install only the core package + dev tools. CASA itself is NOT
          # installed in CI; tests marked @pytest.mark.casa are skipped
          # automatically when casatools/casatasks are absent.
          pip install -e ".[dev]"

      - name: Show installed package versions
        run: |
          python -c "import ajisai; print('AJISAI', ajisai.__version__)"
          pip list

      - name: Run pytest
        run: |
          pytest -v --tb=short --cov=ajisai --cov-report=term-missing

      - name: Upload coverage report (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage*
          retention-days: 14

  # -------------------------------------------------------------------------
  # Documentation build (sanity check that Sphinx still works)
  # -------------------------------------------------------------------------
  docs:
    name: Sphinx build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install with docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          # MyST 'linkify' extension is optional; install when present in conf.
          pip install linkify-it-py

      - name: Build HTML docs
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going -n"

      - name: Upload HTML output
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

  # -------------------------------------------------------------------------
  # Lint / static checks (best-effort; failures here are advisory in v0.1)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    continue-on-error: true   # do NOT block PRs on lint in v0.1

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check ajisai tests examples tools
